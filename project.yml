name: IslandClip
options:
  bundleIdPrefix: com.snowkiss13
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  IslandClip:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Island Clip
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.snowkiss13.islandclip
            CFBundleURLSchemes: [islandclip]
    entitlements:
      path: App/IslandClip.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.snowkiss13.islandclip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowkiss13.islandclip
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/IslandClip.entitlements
    dependencies:
      - target: IslandClipWidget
        embed: true
  IslandClipWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Island Clip Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/IslandClipWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.snowkiss13.islandclip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowkiss13.islandclip.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/IslandClipWidget.entitlements
